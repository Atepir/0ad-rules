name: Build Pyromod

on:
  push:
    branches:
      - main
    tags:
      - v**
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # The mod lives in its own subdirectory so that the repository can also hold the
  # development helpers (tools/, deploy.ps1, README.md), which must not be packaged.
  MOD_NAME: rules
  MOD_DIRECTORY: rules

jobs:
  build-pyromod:
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: 0ad-matters/gh-action-build-pyromod@v2
        with:
          name: ${{ env.MOD_NAME }}
          version: ${{ env.MOD_VERSION }}
          directory: ${{ env.MOD_DIRECTORY }}
        id: build-pyromod
      - name: Upload Artifacts
        # Uploads artifacts (combined into a zip file) to the workflow output page
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-${{ env.MOD_VERSION }}
          path: "output/${{ env.MOD_NAME }}*.*"
          if-no-files-found: error

  release-pyromod:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MOD_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Massage Variables
        run: |
          echo "MOD_VERSION=${MOD_VERSION:1}" >> $GITHUB_ENV
      - name: Sync the mod manifest with the tag
        # The name of the .pyromod is derived from the tag, but the version the game reports
        # (and uses for the mod compatibility check between players) is the one in mod.json.
        # This only rewrites the checked out working copy, nothing is committed.
        run: |
          sed -i -E "s/^([[:space:]]*\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\".*)$/\1${MOD_VERSION}\2/" "$MOD_DIRECTORY/mod.json"
          grep -q "\"version\": \"${MOD_VERSION}\"" "$MOD_DIRECTORY/mod.json"
      - uses: 0ad-matters/gh-action-build-pyromod@v2
        with:
          name: ${{ env.MOD_NAME }}
          version: ${{ env.MOD_VERSION }}
          directory: ${{ env.MOD_DIRECTORY }}
        id: build-pyromod
      - name: Create sha256sum
        run: |
          OUTPUT_FILE="$MOD_NAME-$MOD_VERSION.pyromod"
          cd output
          sha256sum $OUTPUT_FILE > $OUTPUT_FILE.sha256sum
      - name: Release PyroMod
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: True
          prerelease: False
          artifacts: "output/${{ env.MOD_NAME }}*.*"
          token: ${{ secrets.GITHUB_TOKEN }}
          omitNameDuringUpdate: True
          omitBodyDuringUpdate: True
